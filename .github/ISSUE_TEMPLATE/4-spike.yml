# Wygenerowane z Monorise-Team/.github (templates/) przez scripts/repo-setup.mjs; zmieniaj wzorzec, nie ten plik.
name: 🔍 Spike / rozpoznanie
description: Ograniczone czasowo śledztwo. Efektem jest decyzja, a nie wdrożony kod.
type: "🔍 Spike"
projects:
  - Monorise-Team/3
body:
  - type: textarea
    id: question
    attributes:
      label: Pytanie
      description: Jedno pytanie, na które odpowiedź coś rozstrzyga. Napisz też, co jest nim zablokowane.
      placeholder: Czy serwer AvenMail utrzyma połączenia IMAP IDLE na Vercel, czy potrzebny jest kontener? Blokuje wybór miejsca działania serwera.
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: Limit czasu
      description: Sztywna granica. Gdy się skończy, spisujesz, co wiesz, nawet jeśli odpowiedź brzmi „dalej nie wiadomo”.
      placeholder: 1 dzień
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Obszar
      multiple: true
      options:
        - web
        - server
        - mobile
        - time
        - leave
        - reports
        - website
        - design
        - nie wiem
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options:
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Nakład pracy
      description: Mały to ten sam dzień, średni około 2 dni, duży około tygodnia. Bez odpowiedzi średni.
      options:
        - Mały
        - Średni
        - Duży
    validations:
      required: false

  - type: textarea
    id: options
    attributes:
      label: Opcje i kryteria
      description: Opcjonalne. Kandydaci, o których już wiesz, i co decyduje o wyborze.
      placeholder: |
        Kontener na AWS / funkcje Vercel / osobny worker
        Decyduje: nowa poczta widoczna w mniej niż 5 sekund, koszt.
    validations:
      required: false

  - type: textarea
    id: relations
    attributes:
      label: Zależności
      description: "Opcjonalne, jedna na linię. `Czeka na: #123` to zgłoszenie, które musi być gotowe wcześniej, `Część: #45` to większe zadanie, którego to jest etapem."
      placeholder: |
        Czeka na: #12
        Część: #4
    validations:
      required: false
