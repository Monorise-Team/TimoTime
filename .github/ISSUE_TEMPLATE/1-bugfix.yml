# Wygenerowane z Monorise-Team/.github (templates/) przez scripts/repo-setup.mjs; zmieniaj wzorzec, nie ten plik.
name: 🐛 Zgłoszenie błędu
description: Coś działa niepoprawnie, wywala się albo zwraca zły wynik.
labels:
  - "type: 🐛 bugfix"
  - "meta: ❓ needs triage"
projects:
  - Monorise-Team/3
body:
  - type: textarea
    id: what
    attributes:
      label: Co się dzieje
      description: Co jest zepsute i jaki błąd widzisz. Wklej treść błędu, jeśli jakiś jest.
      placeholder: "Wysłanie maila z załącznikiem ponad 10 MB nic nie robi, w konsoli „SMTP error: 552”."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Kroki do odtworzenia
      description: Tak, żeby ktoś inny mógł to powtórzyć.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: Czego się spodziewasz
      placeholder: Mail wychodzi z załącznikiem i ląduje w Wysłanych.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Obszar
      multiple: true
      options:
        - web
        - server
        - mobile
        - time
        - leave
        - reports
        - website
        - design
        - nie wiem
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      description: P0 to produkcja leży, P1 blokuje milestone, P2 poczeka, P3 to kosmetyka.
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Nakład pracy
      description: Mały to ten sam dzień, średni około 2 dni, duży około tygodnia. Bez odpowiedzi średni.
      options:
        - Mały
        - Średni
        - Duży
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logi / zrzuty ekranu
      description: Opcjonalne. Obrazki możesz przeciągnąć prosto tutaj. Nie wklejaj haseł, tokenów ani treści cudzych maili.
    validations:
      required: false

  - type: textarea
    id: relations
    attributes:
      label: Zależności
      description: "Opcjonalne, jedna na linię. `Czeka na: #123` to zgłoszenie, które musi być gotowe wcześniej, `Część: #45` to większe zadanie, którego to jest etapem."
      placeholder: |
        Czeka na: #12
        Część: #4
    validations:
      required: false
