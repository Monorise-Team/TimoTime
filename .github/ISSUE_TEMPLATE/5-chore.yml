# Wygenerowane z Monorise-Team/.github (templates/) przez scripts/repo-setup.mjs; zmieniaj wzorzec, nie ten plik.
name: 🔧 Utrzymanie
description: Zależności, konfiguracja, build, narzędzia, testy, sprzątanie.
labels:
  - "type: 🔧 chore"
  - "meta: ❓ needs triage"
projects:
  - Monorise-Team/3
body:
  - type: dropdown
    id: kind
    attributes:
      label: Rodzaj
      description: "Testy dostają przy triage etykietę `type: 🧪 test`."
      options:
        - Zależności, czyli aktualizacje, usuwanie, poprawki z audytu
        - Build / CI, czyli potoki, skrypty, konfiguracja
        - Narzędzia, czyli lintery, formatowanie, lokalne środowisko
        - Testy, czyli nowe testy albo lepsze pokrycie
        - Sprzątanie, czyli martwy kod, nieaktualne pliki, TODO
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Co trzeba zrobić i dlaczego teraz
      placeholder: Podbić Tauri z 2.11 na 2.12, bo nowa wersja poprawia bezpieczeństwo WebView.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Obszar
      multiple: true
      options:
        - web
        - server
        - mobile
        - time
        - leave
        - reports
        - website
        - design
        - całe repozytorium
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorytet
      options:
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Nakład pracy
      description: Mały to ten sam dzień, średni około 2 dni, duży około tygodnia. Bez odpowiedzi średni.
      options:
        - Mały
        - Średni
        - Duży
    validations:
      required: false

  - type: textarea
    id: relations
    attributes:
      label: Zależności
      description: "Opcjonalne, jedna na linię. `Czeka na: #123` to zgłoszenie, które musi być gotowe wcześniej, `Część: #45` to większe zadanie, którego to jest etapem."
      placeholder: |
        Czeka na: #12
        Część: #4
    validations:
      required: false
